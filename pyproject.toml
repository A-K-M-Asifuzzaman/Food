[project]
name = "nutrivision"
version = "0.1.0"
description = "Food recognition, nutrition estimation and grounded dietary reasoning over Food-101"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = { text = "MIT" }
authors = [{ name = "A K M Asifuzzaman" }]

dependencies = [
    "torch>=2.5",
    "torchvision>=0.20",
    "timm>=1.0.11",
    "transformers>=4.44",
    "datasets>=3.0",
    "huggingface-hub>=0.26",
    "safetensors>=0.4",
    "pillow>=10.4",
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "scipy>=1.14",
    "scikit-learn>=1.5",
    "tqdm>=4.66",
    "rich>=13.9",
    "pyyaml>=6.0",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
]

[project.optional-dependencies]
train = [
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "umap-learn>=0.5.6",
    "grad-cam>=1.5",
    "tensorboard>=2.18",
]
rag = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langchain-openai>=1.0",
    "langchain-cohere>=0.6",
    "langchain-huggingface>=1.0",
    "langgraph>=1.0",
    "sentence-transformers>=3.2",
    "rank-bm25>=0.2.2",
    "networkx>=3.4",
]
serve = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.12",
    "onnxruntime>=1.19",
    "sse-starlette>=2.1",
    "slowapi>=0.1.9",
]
docs = [
    "python-pptx>=1.0",
    "jupyter>=1.1",
    "ipykernel>=6.29",
    "ipywidgets>=8.1",
    "nbformat>=5.10",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nutrivision"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
